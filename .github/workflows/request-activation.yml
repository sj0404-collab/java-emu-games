name: Request Unity ALF File

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: 'Unity version'
        required: false
        default: '2022.3.20f1'

jobs:
  request-alf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate .alf file via Unity Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            unityci/editor:ubuntu-${{ github.event.inputs.unityVersion || '2022.3.20f1' }}-base-3 \
            /opt/Unity/Editor/Unity -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true

          echo "--- Generated files ---"
          ls -la *.alf 2>/dev/null || echo "No .alf in root, checking subdirs..."
          find . -name '*.alf' -type f 2>/dev/null

      - name: Move .alf to known location
        run: |
          ALF_FILE=$(find . -name '*.alf' -type f 2>/dev/null | head -1)
          if [ -z "$ALF_FILE" ]; then
            echo "ERROR: No .alf file found"
            exit 1
          fi
          mv "$ALF_FILE" ./UnityActivation.alf
          echo "alf_path=./UnityActivation.alf" >> $GITHUB_OUTPUT
          echo "Found: $ALF_FILE"
          ls -la ./UnityActivation.alf
        id: locate_alf

      - name: Upload ALF file
        uses: actions/upload-artifact@v4
        with:
          name: UnityActivationFile
          path: ./UnityActivation.alf
          if-no-files-found: error
