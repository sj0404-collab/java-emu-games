name: Build Unity Android APK

on:
  push:
    branches: [ unity, main ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'build'
        type: choice
        options:
          - build
          - alf-only

env:
  UNITY_VERSION: '2022.3.20f1'

jobs:
  generate-alf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.mode == 'alf-only'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .alf via Unity Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-3 \
            /opt/Unity/Editor/Unity -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true

          echo "--- Generated files ---"
          find . -name '*.alf' -type f 2>/dev/null

      - name: Move .alf to known location
        id: locate
        run: |
          ALF_FILE=$(find . -name '*.alf' -type f 2>/dev/null | head -1)
          if [ -z "$ALF_FILE" ]; then
            echo "ERROR: No .alf file found"
            find . -type f -newer /github/workspace/.git | head -20
            exit 1
          fi
          cp "$ALF_FILE" ./UnityActivation.alf
          echo "path=./UnityActivation.alf" >> $GITHUB_OUTPUT
          ls -la ./UnityActivation.alf

      - name: Upload ALF file
        uses: actions/upload-artifact@v4
        with:
          name: UnityActivationFile
          path: ./UnityActivation.alf
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.mode != 'alf-only'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: |-\n            Library-${{ env.UNITY_VERSION }}-\n            Library-\n
      - name: Activate Unity License
        uses: game-ci/unity-activate@v2
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: BuildScript.BuildAndroid
          customParameters: -quit -batchmode -nographics

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroesLoreZero-Unity-APK
          path: build/*.apk
          if-no-files-found: warn

      - name: Return Unity License
        if: always()
        uses: game-ci/unity-return-license@v2

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.mode != 'alf-only' && github.ref == 'refs/heads/unity' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: HeroesLoreZero-Unity-APK

      - name: Get APK info
        id: apk_info
        run: |
          APK_FILE=$(ls *.apk 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then echo "No APK found"; exit 1; fi
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unity-v${{ github.run_number }}
          name: Heroes Lore Zero — Unity v${{ github.run_number }}
          body: |
            Heroes Lore: Zero — Unity Engine (C#)
            APK Size: ${{ steps.apk_info.outputs.size }}
            Built with Unity ${{ env.UNITY_VERSION }}
          files: |
            *.apk
          draft: false
          prerelease: false
