name: Build Unity Android APK

on:
  push:
    branches: [ unity, main ]

env:
  UNITY_VERSION: '2022.3.20f1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ALF and activate license
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/alf_out \
            -w /alf_out \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3 \
            /opt/unity/Editor/Unity -batchmode -nographics -createManualActivationFile -logfile /dev/null || true
          ALF_FILE=$(ls *.alf 2>/dev/null | head -1)
          if [ -z "$ALF_FILE" ]; then echo 'No ALF'; exit 1; fi
          echo "ALF: $(wc -c < "$ALF_FILE") bytes"
          ALF_B64=$(base64 -w0 "$ALF_FILE")
          
          # Activate via Unity License API
          curl -s -X POST 'https://license.unity3d.com/activate/serial' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "email=memar16974@murkstar.com" \
            --data-urlencode "password=Memo16974@" \
            --data-urlencode "serial=PERSONAL" \
            --data-urlencode "request=activation" \
            --data-urlencode "alf=$ALF_B64" \
            -o /tmp/resp.json
          echo "=== Activation Response ==="
          cat /tmp/resp.json | head -c 2000
          
          # Extract ULF
          python3 << 'PYEOF'
          import json, sys, os
          try:
              with open('/tmp/resp.json') as f:
                  data = json.load(f)
              result = data.get('Result', '')
              if result:
                  os.makedirs('/root/.local/share/unity3d/Unity', exist_ok=True)
                  with open('/root/.local/share/unity3d/Unity/Unity_lic.ulf', 'w') as f:
                      f.write(result)
                  print('ULF saved: %d bytes' % len(result))
              else:
                  print('No ULF in response')
                  print(str(data)[:500])
                  sys.exit(1)
          except Exception as e:
              print('Error: %s' % e)
              sys.exit(1)
          PYEOF

      - name: Build APK with Unity Docker
        run: |
          ls -la /root/.local/share/unity3d/Unity/ 2>/dev/null || echo 'No license dir'
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -v /root/.local/share/unity3d/Unity:/root/.local/share/unity3d/Unity:ro \
            -w /project \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3 \
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -executeMethod BuildScript.BuildAndroid \
              -buildTarget Android \
              -quit \
              -logfile /dev/stdout 2>&1 | tee /tmp/build-log.txt

      - name: Save log to repo
        if: always()
        run: |
          for f in /tmp/build-log.txt /tmp/resp.json; do
            if [ -f "$f" ]; then
              BASE=$(basename "$f")
              tail -100 "$f" > "log-${{ github.run_number }}-$BASE"
              git add "log-${{ github.run_number }}-$BASE" 2>/dev/null || true
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "logs ${{ github.run_number }}" || true
          git pull --rebase origin unity || true
          git push origin unity || true

      - name: Release APK
        run: |
          APK=$(find build -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo 'No APK'; exit 1; fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "APK: $APK ($SIZE)"
          gh release create "unity-v${{ github.run_number }}" "$APK" \
            --title "Heroes Lore Zero Unity v${{ github.run_number }}" \
            --notes "Unity ${{ env.UNITY_VERSION }}, Size: $SIZE"
