name: Build Unity Android APK

on:
  push:
    branches: [ unity, main ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'build'
        type: choice
        options:
          - build
          - alf-only

env:
  UNITY_VERSION: '2022.3.20f1'

jobs:
  generate-alf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.mode == 'alf-only'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .alf via Unity Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/alf_output \
            -w /alf_output \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-3 \
            /opt/unity/Editor/Unity -batchmode -nographics -createManualActivationFile -logfile /dev/stdout \
            || true
          echo "=== Looking for .alf files ==="
          find . -name '*.alf' -type f 2>/dev/null

      - name: Move .alf to known location
        id: locate
        run: |
          ALF_FILE=$(find . -name '*.alf' -type f 2>/dev/null | head -1)
          if [ -z "$ALF_FILE" ]; then
            echo "ERROR: No .alf file found"
            find . -type f -name '*alf*' 2>/dev/null
            exit 1
          fi
          cp "$ALF_FILE" ./UnityActivation.alf
          echo "path=./UnityActivation.alf" >> $GITHUB_OUTPUT
          ls -la ./UnityActivation.alf

      - name: Upload ALF file
        uses: actions/upload-artifact@v4
        with:
          name: UnityActivationFile
          path: ./UnityActivation.alf
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.inputs.mode != 'alf-only'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Unity Docker image
        run: |
          docker pull unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3

      - name: Build APK with Unity Docker
        id: unity_build
        env:
          UNITY_EMAIL: 'memar16974@murkstar.com'
          UNITY_PASSWORD: 'Memo16974@'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -w /project \
            -e UNITY_EMAIL="$UNITY_EMAIL" \
            -e UNITY_PASSWORD="$UNITY_PASSWORD" \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3 \
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -username "$UNITY_EMAIL" \
              -password "$UNITY_PASSWORD" \
              -executeMethod BuildScript.BuildAndroid \
              -buildTarget Android \
              -quit \
              -logfile /dev/stdout 2>&1 | tee build-log.txt

      - name: Push build log to repo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build-log.txt ]; then
            tail -200 build-log.txt > build-log-tail.txt
            git add build-log-tail.txt
            git config user.name 'github-actions'
            git config user.email 'actions@github.com'
            git commit -m "Build log for run ${{ github.run_number }}" || true
            git push origin unity
          fi

      - name: Check for APK
        id: check_apk
        run: |
          echo "=== Files in build/ ==="
          ls -la build/ 2>/dev/null || echo "build/ dir not found"
          echo "=== All APK files ==="
          find . -name '*.apk' -type f 2>/dev/null
          APK=$(find build -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "file=$APK" >> $GITHUB_OUTPUT
            echo "size=$SIZE" >> $GITHUB_OUTPUT
            echo "APK found: $APK ($SIZE)"
          else
            echo "ERROR: No APK built"
            exit 1
          fi

      - name: Create Release and Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="unity-v${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Heroes Lore Zero Unity v${{ github.run_number }}" \
            --notes "Heroes Lore: Zero Unity Engine (C#) - Built with Unity ${{ env.UNITY_VERSION }}\nAPK Size: ${{ steps.check_apk.outputs.size }}" \
            ${{ steps.check_apk.outputs.file }}
