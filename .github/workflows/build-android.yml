name: Build Unity Android APK

on:
  push:
    branches: [ unity, main ]

env:
  UNITY_VERSION: '2022.3.20f1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Unity Docker image
        run: |
          docker pull unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3

      - name: Build APK with Unity Docker
        id: unity_build
        env:
          UNITY_EMAIL: 'memar16974@murkstar.com'
          UNITY_PASSWORD: 'Memo16974@'
        run: |
          set -o pipefail
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -w /project \
            -e UNITY_EMAIL="$UNITY_EMAIL" \
            -e UNITY_PASSWORD="$UNITY_PASSWORD" \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3 \
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -username "$UNITY_EMAIL" \
              -password "$UNITY_PASSWORD" \
              -executeMethod BuildScript.BuildAndroid \
              -buildTarget Android \
              -quit \
              -logfile /dev/stdout 2>&1 | tee /tmp/build-log.txt

      - name: Upload log
        if: always()
        run: |
          if [ -f /tmp/build-log.txt ]; then
            tail -300 /tmp/build-log.txt > /tmp/build-log-tail.txt
            curl -F 'file=@/tmp/build-log-tail.txt' https://0x0.st 2>&1 || echo 'Upload failed'
          fi

      - name: Check for APK
        id: check_apk
        run: |
          ls -la build/ 2>/dev/null || echo "build/ not found"
          find . -name '*.apk' -type f 2>/dev/null
          APK=$(find build -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "file=$APK" >> $GITHUB_OUTPUT
            echo "size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "No APK found"
            exit 1
          fi

      - name: Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "unity-v${{ github.run_number }}" \
            --title "Heroes Lore Zero Unity v${{ github.run_number }}" \
            --notes "Built with Unity ${{ env.UNITY_VERSION }}, Size: ${{ steps.check_apk.outputs.size }}" \
            ${{ steps.check_apk.outputs.file }}
