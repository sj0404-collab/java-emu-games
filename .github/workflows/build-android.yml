name: Build Unity Android APK

on:
  push:
    branches: [ unity, main ]
  workflow_dispatch:

env:
  UNITY_VERSION: '2022.3.20f1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'ProjectSettings/**') }}
          restore-keys: |-
            Library-${{ env.UNITY_VERSION }}-
            Library-

      - name: Activate Unity License (auto)
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: BuildScript.BuildAndroid
          customParameters: -quit -batchmode -nographics

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroesLoreZero-Unity-APK
          path: build/*.apk
          if-no-files-found: warn

      - name: Return Unity License
        if: always()
        uses: game-ci/unity-return-license@v2

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/unity' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: HeroesLoreZero-Unity-APK

      - name: Get APK info
        id: apk_info
        run: |
          APK_FILE=$(ls *.apk 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then echo "No APK found"; exit 1; fi
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unity-v${{ github.run_number }}
          name: Heroes Lore Zero — Unity v${{ github.run_number }}
          body: |
            Heroes Lore: Zero — Unity Engine (C#)
            APK Size: ${{ steps.apk_info.outputs.size }}
            Built with Unity ${{ env.UNITY_VERSION }}
          files: |
            *.apk
          draft: false
          prerelease: false