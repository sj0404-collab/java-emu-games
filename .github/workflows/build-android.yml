name: Build Unity Android APK

on:
  push:
    branches: [ unity, main ]

env:
  UNITY_VERSION: '2022.3.20f1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pull Unity Docker image
        run: |
          docker pull unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3

      - name: Build APK with Unity Docker
        id: unity_build
        env:
          UNITY_EMAIL: 'memar16974@murkstar.com'
          UNITY_PASSWORD: 'Memo16974@'
        run: |
          set -o pipefail
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -w /project \
            -e UNITY_EMAIL="$UNITY_EMAIL" \
            -e UNITY_PASSWORD="$UNITY_PASSWORD" \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3 \
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -username "$UNITY_EMAIL" \
              -password "$UNITY_PASSWORD" \
              -executeMethod BuildScript.BuildAndroid \
              -buildTarget Android \
              -quit \
              -logfile /dev/stdout 2>&1 | tee /tmp/build-log.txt

      - name: Save log to repo
        if: always()
        run: |
          if [ -f /tmp/build-log.txt ]; then
            LOG_SIZE=$(wc -c < /tmp/build-log.txt)
            echo "Log size: $LOG_SIZE bytes"
            tail -200 /tmp/build-log.txt > "build-log-${{ github.run_number }}.txt"
            git add "build-log-${{ github.run_number }}.txt"
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "Add build log for run ${{ github.run_number }}" || true
            git pull --rebase origin unity || true
            git push origin unity || true
          else
            echo 'No build log file found'
          fi

      - name: Check for APK
        id: check_apk
        run: |
          ls -la build/ 2>/dev/null || echo "build/ not found"
          find . -name '*.apk' -type f 2>/dev/null
          APK=$(find build -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "file=$APK" >> $GITHUB_OUTPUT
            echo "size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "No APK found"
            exit 1
          fi

      - name: Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "unity-v${{ github.run_number }}" \
            --title "Heroes Lore Zero Unity v${{ github.run_number }}" \
            --notes "Built with Unity ${{ env.UNITY_VERSION }}, Size: ${{ steps.check_apk.outputs.size }}" \
            ${{ steps.check_apk.outputs.file }}
