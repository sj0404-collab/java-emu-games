name: Build Unity Android APK

on:
  push:
    branches: [ unity, main ]

env:
  UNITY_VERSION: '2022.3.20f1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Activate Unity license
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: 'memar16974@murkstar.com'
          UNITY_PASSWORD: 'Memo16974@'
        with:
          unityVersion: ${{ env.UNITY_VERSION }}

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: 'memar16974@murkstar.com'
          UNITY_PASSWORD: 'Memo16974@'
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: BuildScript.BuildAndroid
          customParameters: -username ${{ env.UNITY_EMAIL }} -password ${{ env.UNITY_PASSWORD }}

      - name: Check for APK
        id: check_apk
        run: |
          ls -la build/ 2>/dev/null || echo "build/ not found"
          find . -name '*.apk' -type f 2>/dev/null
          APK=$(find build -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "file=$APK" >> $GITHUB_OUTPUT
            echo "size=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "No APK found"
            exit 1
          fi

      - name: Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "unity-v${{ github.run_number }}" \
            --title "Heroes Lore Zero Unity v${{ github.run_number }}" \
            --notes "Built with Unity ${{ env.UNITY_VERSION }}, Size: ${{ steps.check_apk.outputs.size }}" \
            ${{ steps.check_apk.outputs.file }}
