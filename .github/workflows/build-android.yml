name: Build Unity Android APK

on:
  push:
    branches: [ unity, main ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'build'
        type: choice
        options:
          - build
          - alf-only

env:
  UNITY_VERSION: '2022.3.20f1'

jobs:
  generate-alf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.mode == 'alf-only'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .alf via Unity Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/alf_output \
            -w /alf_output \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-3 \
            /opt/unity/Editor/Unity -batchmode -nographics -createManualActivationFile -logfile /dev/stdout \
            || true
          echo "=== Looking for .alf files ==="
          find . -name '*.alf' -type f 2>/dev/null

      - name: Move .alf to known location
        id: locate
        run: |
          ALF_FILE=$(find . -name '*.alf' -type f 2>/dev/null | head -1)
          if [ -z "$ALF_FILE" ]; then
            echo "ERROR: No .alf file found"
            find . -type f -name '*alf*' 2>/dev/null
            exit 1
          fi
          cp "$ALF_FILE" ./UnityActivation.alf
          echo "path=./UnityActivation.alf" >> $GITHUB_OUTPUT
          ls -la ./UnityActivation.alf

      - name: Upload ALF file
        uses: actions/upload-artifact@v4
        with:
          name: UnityActivationFile
          path: ./UnityActivation.alf
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.mode != 'alf-only'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Unity Docker
        env:
          UNITY_EMAIL: 'memar16974@murkstar.com'
          UNITY_PASSWORD: 'Memo16974@'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -w /project \
            -e UNITY_EMAIL="$UNITY_EMAIL" \
            -e UNITY_PASSWORD="$UNITY_PASSWORD" \
            unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-android-3 \
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -username "$UNITY_EMAIL" \
              -password "$UNITY_PASSWORD" \
              -executeMethod BuildScript.BuildAndroid \
              -buildTarget Android \
              -quit \
              -logfile /dev/stdout

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroesLoreZero-Unity-APK
          path: build/*.apk
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.mode != 'alf-only' && github.ref == 'refs/heads/unity' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: HeroesLoreZero-Unity-APK

      - name: Get APK info
        id: apk_info
        run: |
          APK_FILE=$(ls *.apk 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then echo "No APK found"; exit 1; fi
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unity-v${{ github.run_number }}
          name: Heroes Lore Zero Unity v${{ github.run_number }}
          body: |
            Heroes Lore: Zero Unity Engine (C#)
            APK Size: ${{ steps.apk_info.outputs.size }}
            Built with Unity ${{ env.UNITY_VERSION }}
          files: |
            *.apk
          draft: false
          prerelease: false
