name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create signing keystore
        run: keytool -genkeypair -keystore keystore.jks -alias hl -keyalg RSA -keysize 2048 -validity 10000 -storepass heroes123 -keypass heroes123 -dname 'CN=HL,O=GD,C=RU'
        working-directory: heroes-lore-v1

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: heroes-lore-v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heroes-lore-zero-v1
          path: heroes-lore-v1/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
