plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.heroeslore.v1'
    compileSdk 34
    defaultConfig {
        applicationId 'com.heroeslore.v1'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            // standard Android debug keystore — auto-generated by SDK, no config needed
            // explicit for clarity — Gradle will use $HOME/.android/debug.keystore
        }
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'keystore.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: 'heroes123'
            keyAlias System.getenv('KEYSTORE_ALIAS') ?: 'hl'
            keyPassword System.getenv('KEYSTORE_PASS') ?: 'heroes123'
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        release {
            // use debug signing if release keystore not present (allows local/Ci debug builds without setup)
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    lint { abortOnError false }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
